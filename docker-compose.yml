services:
  mysql:
    image: mysql:8.4
    container_name: cashflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cashflow
      MYSQL_USER: cashflow
      MYSQL_PASSWORD: 1234
    ports:
      - "3307:3306"
    volumes:
      - cashflow-data:/var/lib/mysql

volumes:
  cashflow-data: